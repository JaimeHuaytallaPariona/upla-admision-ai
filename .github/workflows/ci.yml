name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: apps/api
        run: ruff check app --select=E,F,W --ignore=E501

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./test.db
          LLM_PROVIDER: claude
          ANTHROPIC_API_KEY: dummy-for-tests
        run: pytest -v tests/

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: apps/web
        run: npm run lint || true

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build

  rag-validation:
    name: Validar JSONL del RAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSONL files
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          errors = 0
          for p in Path('apps/rag-kb/data').glob('*.jsonl'):
              for i, line in enumerate(p.read_text().splitlines(), 1):
                  if not line.strip(): continue
                  try:
                      json.loads(line)
                  except json.JSONDecodeError as e:
                      print(f'{p.name}:{i}: {e}')
                      errors += 1
              print(f'OK {p.name}')
          sys.exit(1 if errors else 0)
          "
