name: RAG eval

on:
  push:
    paths:
      - 'apps/rag-kb/**'
      - '.github/workflows/rag-eval.yml'
  pull_request:
    paths:
      - 'apps/rag-kb/**'
      - '.github/workflows/rag-eval.yml'
  workflow_dispatch:

jobs:
  evaluate:
    name: Evaluar calidad del RAG
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      # Umbrales (ajustables sin tocar el código); calibrados para BAAI/bge-small-en-v1.5
      # con el golden set v0.2 (102 queries). Subir conforme mejore el retriever.
      RAG_MIN_HIT: "0.85"
      RAG_MIN_RECALL: "0.70"
      RAG_MIN_MRR: "0.65"
      RAG_MIN_CITATION: "0.70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ env.EMBEDDING_MODEL }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install fastembed==0.4.2 numpy jsonschema

      - name: Validar schema de chunks
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import jsonschema

          root = Path("apps/rag-kb")
          schema = json.loads((root / "schema" / "chunks_schema.json").read_text())
          validator = jsonschema.Draft7Validator(schema)

          total, errors = 0, 0
          for jsonl in sorted((root / "data").glob("*.jsonl")):
              if "golden" in jsonl.name:
                  continue
              for i, line in enumerate(jsonl.open(), 1):
                  if not line.strip():
                      continue
                  c = json.loads(line)
                  # Catalogos (canales/modalidades) se transforman a chunks en ingesta
                  if "id" not in c or "text" not in c:
                      continue
                  total += 1
                  errs = list(validator.iter_errors(c))
                  if errs:
                      errors += 1
                      print(f"::error file={jsonl}::[{jsonl.name}:{i}] id={c.get('id','?')}: {errs[0].message}")
          print(f"Schema validado: {total} chunks, {errors} errores")
          sys.exit(1 if errors else 0)
          PY

      - name: Ejecutar evaluación RAG (strict)
        run: |
          python apps/rag-kb/scripts/evaluate_ci.py \
            --k 5 \
            --data-dir apps/rag-kb/data \
            --strict \
            --export reports/rag_results.jsonl \
            --markdown reports/rag_report.md

      - name: Publicar reporte en el PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/rag_report.md';
            if (!fs.existsSync(path)) {
              core.warning('No existe reports/rag_report.md');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- rag-eval-report -->';
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            const commentBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body: commentBody,
              });
            }

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-reports
          path: reports/
          retention-days: 30
