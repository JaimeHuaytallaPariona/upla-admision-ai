name: upla-admision-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: upla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upla
      POSTGRES_PASSWORD: upla
      POSTGRES_DB: upla_admision
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upla -d upla_admision"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: upla_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://upla:upla@postgres:5432/upla_admision
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      CORS_ORIGINS: '["http://localhost:3000","http://web:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/rag-kb:/rag-kb:ro
      - hfcache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: upla_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  hfcache:
